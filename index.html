<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FKJ HUNTER // RAILWAY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <style>
        body { background-color: #0f0f0f; color: #00ff00; font-family: 'Courier New', monospace; }
        .log-entry { border-bottom: 1px solid #333; padding: 5px; word-break: break-all; }
        .hit { color: #00ff00; }
        .miss { color: #666; }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body class="p-4 max-w-md mx-auto">

    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold tracking-tighter">FKJ HUNTER</h1>
        <button id="loginBtn" onclick="googleLogin()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
            Google Login
        </button>
        <div id="userInfo" class="hidden text-sm text-gray-400"></div>
    </div>

    <!-- Controls -->
    <div class="grid grid-cols-2 gap-4 mb-6">
        <input type="text" id="token" placeholder="Bot Token" class="bg-black border border-green-500 p-2 text-sm w-full">
        <input type="text" id="chatId" placeholder="Chat ID" class="bg-black border border-green-500 p-2 text-sm w-full">
    </div>

    <div class="flex gap-2 mb-6">
        <button id="startBtn" onclick="startHunter()" class="flex-1 bg-green-600 hover:bg-green-700 text-black font-bold py-3 rounded">
            ▶ START HUNTING
        </button>
        <button id="stopBtn" onclick="stopHunter()" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded hidden">
            ■ STOP
        </button>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-3 gap-2 mb-6 text-center">
        <div class="bg-black border border-gray-700 p-2 rounded">
            <div class="text-xs text-gray-500">HITS</div>
            <div id="hitsCount" class="text-xl font-bold text-green-400">0</div>
        </div>
        <div class="bg-black border border-gray-700 p-2 rounded">
            <div class="text-xs text-gray-500">THREADS</div>
            <div id="threadCount" class="text-xl font-bold text-yellow-400">0</div>
        </div>
        <div class="bg-black border border-gray-700 p-2 rounded">
            <div class="text-xs text-gray-500">STATUS</div>
            <div id="statusText" class="text-xl font-bold text-gray-400">IDLE</div>
        </div>
    </div>

    <!-- Live Logs -->
    <div class="border border-gray-700 rounded h-64 overflow-y-auto bg-black p-2" id="logContainer">
        <div class="text-center text-gray-600 mt-10">Waiting for logs...</div>
    </div>

    <script>
        // --- FIREBASE SETUP ---
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        firebase.initializeApp(firebaseConfig);
        let currentUser = null;

        function googleLogin() {
            const provider = new firebase.auth.GoogleAuthProvider();
            firebase.auth().signInWithPopup(provider).then((result) => {
                currentUser = result.user;
                document.getElementById('loginBtn').classList.add('hidden');
                document.getElementById('userInfo').textContent = currentUser.email;
                document.getElementById('userInfo').classList.remove('hidden');
                loadStats();
            }).catch((error) => console.error(error));
        }

        // --- HUNTER LOGIC ---
        async function startHunter() {
            const token = document.getElementById('token').value;
            const chatId = document.getElementById('chatId').value;
            
            if(!token || !chatId) return alert("Fill Token & Chat ID");

            const res = await fetch('/start', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({token, chat_id: chatId})
            });
            
            const data = await res.json();
            updateUI(true);
        }

        async function stopHunter() {
            await fetch('/stop', {method: 'POST'});
            updateUI(false);
        }

        function updateUI(running) {
            document.getElementById('startBtn').classList.toggle('hidden', running);
            document.getElementById('stopBtn').classList.toggle('hidden', !running);
            document.getElementById('statusText').textContent = running ? "HUNTING" : "IDLE";
            document.getElementById('statusText').className = running ? "text-xl font-bold text-green-400 pulse" : "text-xl font-bold text-gray-400";
        }

        async function loadStats() {
            const res = await fetch('/stats');
            const data = await res.json();
            
            document.getElementById('hitsCount').textContent = data.hits_count;
            document.getElementById('threadCount').textContent = data.running ? "ACTIVE" : "0";
            
            const container = document.getElementById('logContainer');
            container.innerHTML = '';
            
            if(data.logs.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-600 mt-10">No hits yet.</div>';
                return;
            }

            data.logs.forEach(hit => {
                const div = document.createElement('div');
                div.className = 'log-entry hit';
                div.textContent = `[${new Date(hit.created_at).toLocaleTimeString()}] ${hit.email} @${hit.username}`;
                container.prepend(div);
            });
        }

        // Poll for updates every 5 seconds
        setInterval(loadStats, 5000);
    </script>
</body>
</html>
